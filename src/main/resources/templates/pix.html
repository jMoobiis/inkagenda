<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Sinal')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo}"></header>
<main class="secao container">
  <div class="cartao">
    <h1>Pague o sinal para garantir seu horário</h1>
    <p>Horário: <strong th:text="${#temporals.format(sessao.inicio, 'dd/MM/yyyy HH:mm')}">Data</strong></p>
    <p>Sinal: <strong th:text="${solicitacao.valorSinal}">0</strong></p>
    <p>Chave Pix:</p>
    <div class="pix-chave" th:text="${chavePix}">chave</div>
    <p class="ajuda">Pague até <span th:text="${#temporals.format(sessao.expiraEm, 'dd/MM/yyyy HH:mm')}">prazo</span>. Depois disso o horário é liberado.</p>
  </div>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
