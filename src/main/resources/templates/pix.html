<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sinal | InkAgenda</title></head>
<body>
<main>
  <h1>Pague o sinal para garantir seu horário</h1>
  <p>Horário: <span th:text="${#temporals.format(sessao.inicio, 'dd/MM/yyyy HH:mm')}">Data</span></p>
  <p>Sinal: <span th:text="${solicitacao.valorSinal}">0</span></p>
  <p>Chave Pix: <strong th:text="${chavePix}">chave</strong></p>
  <p>Pague até <span th:text="${#temporals.format(sessao.expiraEm, 'dd/MM/yyyy HH:mm')}">prazo</span>. Depois disso o horário é liberado.</p>
</main>
</body>
</html>
