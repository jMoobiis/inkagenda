<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecalho(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | InkAgenda'">InkAgenda</title>
  <link rel="stylesheet" th:href="@{/css/inkagenda.css}">
</head>
<body>
<header class="topo" th:fragment="topo">
  <div class="container">
    <a class="logo" th:href="@{/}">INKAGENDA <span>//</span> GUSTA</a>
    <nav class="nav" aria-label="Principal">
      <a th:href="@{/#portfolio}">Portfólio</a>
      <a th:href="@{/#como-funciona}">Como Funciona</a>
      <a th:href="@{/orcamento}">Orçamento</a>
      <a class="discreto" th:href="@{/login}">Log In (Admin)</a>
    </nav>
  </div>
</header>
<footer class="rodape" th:fragment="rodape">
  <div class="container">
    <p>InkAgenda // Gusta. Seus dados são usados só para o seu atendimento.</p>
  </div>
</footer>
</body>
</html>
