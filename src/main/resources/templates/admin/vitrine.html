<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Vitrine')}"></head>
<body class="admin">
<nav th:replace="~{admin/_menu :: menu}"></nav>
<main class="container secao">
  <h1>Gerenciar Portfólio &amp; Vitrine</h1>
  <form class="cartao" th:action="@{/admin/vitrine/modo}" method="post">
    <label class="campo">Modo de exibição
      <select name="modo"><option th:each="m : ${modos}" th:value="${m}" th:text="${m}" th:selected="${m == modo}">Modo</option></select>
    </label>
    <button class="btn btn-bloco" type="submit">Aplicar</button>
  </form>
  <form class="cartao" th:action="@{/admin/vitrine/fotos}" method="post" enctype="multipart/form-data">
    <h2>Nova foto</h2>
    <label class="campo">Título <input name="titulo" required></label>
    <label class="campo">Estilo <select name="estilo"><option th:each="e : ${estilos}" th:value="${e}" th:text="${e.rotulo}">Estilo</option></select></label>
    <label class="campo">Tag de destaque <input name="tagDestaque"></label>
    <label class="campo">Ordem <input type="number" name="displayOrder"></label>
    <label class="campo">Imagem <input type="file" name="arquivo" accept="image/jpeg,image/png" required></label>
    <button class="btn btn-bloco" type="submit">Adicionar</button>
  </form>
  <h2>Fotos</h2>
  <div class="grade-admin">
    <article class="cartao-item" th:each="foto : ${fotos}">
      <img th:src="@{/admin/vitrine/fotos/{id}/imagem(id=${foto.id})}" th:alt="${foto.titulo}">
      <p><span th:text="${foto.id}">0</span>: <strong th:text="${foto.titulo}">Título</strong></p>
      <p>
        <span class="etiqueta" th:text="${foto.ativo ? 'Ativa' : 'Oculta'}">Ativa</span>
        <span class="etiqueta" th:if="${foto.fixadoHero}">No Hero</span>
      </p>
      <form th:action="@{/admin/vitrine/fotos/{id}/ativa(id=${foto.id})}" method="post">
        <input type="hidden" name="valor" th:value="${!foto.ativo}">
        <button class="btn btn-mini" type="submit" th:text="${foto.ativo ? 'Ocultar' : 'Ativar'}">Ocultar</button>
      </form>
      <form th:action="@{/admin/vitrine/fotos/{id}/hero(id=${foto.id})}" method="post">
        <input type="hidden" name="valor" th:value="${!foto.fixadoHero}">
        <button class="btn btn-mini" type="submit" th:text="${foto.fixadoHero ? 'Retirar do Hero' : 'Fixar no Hero'}">Fixar</button>
      </form>
    </article>
  </div>
  <form class="cartao" th:action="@{/admin/vitrine/ordem}" method="post">
    <h2>Reordenar</h2>
    <label class="campo">Códigos das fotos na nova ordem, separados por vírgula <input name="ids" required></label>
    <button class="btn btn-bloco" type="submit">Salvar ordem</button>
  </form>
</main>
</body>
</html>
