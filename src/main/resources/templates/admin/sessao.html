<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Sessão')}"></head>
<body class="admin">
<nav th:replace="~{admin/_menu :: menu}"></nav>
<main class="container secao">
  <h1>Sessão</h1>
  <p th:text="${sessao.solicitacao.cliente.nome}">Cliente</p>
  <p>Status: <span th:text="${sessao.status}">Status</span></p>
  <p><span th:text="${#temporals.format(sessao.inicio, 'dd/MM/yyyy HH:mm')}">Início</span> até <span th:text="${#temporals.format(sessao.fim, 'HH:mm')}">Fim</span></p>
  <p>Sinal combinado: <span th:text="${sessao.solicitacao.valorSinal}">0</span></p>
  <p th:if="${sessao.valorRecebido}">Recebido: <span th:text="${sessao.valorRecebido}">0</span>. A abater: <span th:text="${sessao.valorAAbater}">0</span></p>
  <p th:if="${sessao.comprovante}"><a th:href="@{/admin/sessoes/{id}/comprovante(id=${sessao.id})}">Ver comprovante</a></p>
  <form class="cartao" th:if="${sessao.status.name() == 'PRE_RESERVADA'}" th:action="@{/admin/sessoes/{id}/sinal(id=${sessao.id})}" method="post" enctype="multipart/form-data">
    <h2>Registrar sinal</h2>
    <label class="campo">Data do pagamento <input type="date" name="dataPagamento" required></label>
    <label class="campo">Valor recebido <input type="number" step="0.01" min="0.01" name="valorRecebido" required></label>
    <label class="campo">Comprovante (opcional) <input type="file" name="comprovante" accept="image/jpeg,image/png"></label>
    <label class="campo-check"><input type="checkbox" name="confirmacaoDivergencia" value="true"><span> Confirmo o valor mesmo se divergir do combinado</span></label>
    <button class="btn btn-bloco" type="submit">Registrar sinal</button>
  </form>
  <th:block th:if="${sessao.status.ocupaAgenda()}">
    <form class="cartao" th:action="@{/admin/sessoes/{id}/remarcar(id=${sessao.id})}" method="post">
      <h2>Remarcar</h2>
      <label class="campo">Novo início <input type="datetime-local" name="novoInicio" required></label>
      <label class="campo-check"><input type="checkbox" name="confirmacaoExplicitaPerdaSinal" value="true"><span> Ciente da perda do sinal, se houver</span></label>
      <button class="btn btn-bloco" type="submit">Remarcar</button>
    </form>
    <form class="cartao" th:action="@{/admin/sessoes/{id}/cancelar(id=${sessao.id})}" method="post">
      <h2>Cancelar</h2>
      <label class="campo-check"><input type="checkbox" name="confirmacaoExplicitaPerdaSinal" value="true"><span> Ciente da perda do sinal, se houver</span></label>
      <button class="btn btn-bloco" type="submit">Cancelar sessão</button>
    </form>
  </th:block>
  <p th:if="${linkFicha}">Link da ficha: <span th:text="${linkFicha}">link</span></p>
  <p th:if="${ficha}"><a th:href="@{/admin/sessoes/{id}/anamnese(id=${sessao.id})}">Ver anamnese</a></p>
</main>
</body>
</html>
