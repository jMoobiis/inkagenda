<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Véspera')}"></head>
<body class="admin">
<nav th:replace="~{admin/_menu :: menu}"></nav>
<main class="container secao">
  <h1>Sessões de amanhã</h1>
  <p class="vazio" th:if="${#lists.isEmpty(lembretes)}">Nenhuma sessão confirmada para amanhã.</p>
  <article class="cartao-item cartao-grande" th:each="lembrete : ${lembretes}">
    <h2 th:text="${lembrete.sessao.solicitacao.cliente.nome}">Cliente</h2>
    <p th:text="${#temporals.format(lembrete.sessao.inicio, 'dd/MM/yyyy HH:mm')}">Horário</p>
    <a class="btn" th:if="${lembrete.podeEnviar()}" th:href="${lembrete.linkWhatsApp}" target="_blank" rel="noopener">Enviar Lembrete WhatsApp</a>
    <th:block th:unless="${lembrete.podeEnviar()}">
      <button class="btn" type="button" disabled>Enviar Lembrete WhatsApp</button>
      <p class="alerta" th:text="${lembrete.aviso}" role="alert">Aviso</p>
    </th:block>
    <p class="etiqueta" th:if="${lembrete.sessao.presencaConfirmada}">Presença confirmada</p>
    <form th:unless="${lembrete.sessao.presencaConfirmada}" th:action="@{/admin/sessoes/{id}/presenca(id=${lembrete.sessao.id})}" method="post"><button class="btn btn-claro-escuro" type="submit">Presença Confirmada</button></form>
  </article>
</main>
</body>
</html>
