<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Orçamento')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo}"></header>
<main class="secao container">
  <div class="cartao">
    <h1>Solicitar orçamento</h1>
    <p class="alerta" th:if="${erro}" th:text="${erro}" role="alert">Erro</p>
    <form th:action="@{/orcamento}" th:object="${form}" method="post" enctype="multipart/form-data">
      <p class="alerta" th:each="e : ${#fields.allErrors()}" th:text="${e}" role="alert">Erro</p>
      <label class="campo">Nome <input th:field="*{nome}" required autocomplete="name"></label>
      <label class="campo">WhatsApp com DDD <input th:field="*{whatsapp}" type="tel" inputmode="tel" placeholder="(11) 90000-0000" required></label>
      <label class="campo">Tamanho em cm <input th:field="*{tamanhoCm}" type="number" inputmode="numeric" min="1" max="300" required></label>
      <label class="campo">Região do corpo <input th:field="*{regiaoCorpo}" required></label>
      <label class="campo">Estilo
        <select th:field="*{estilo}" required>
          <option th:each="e : ${estilosDisponiveis}" th:value="${e}" th:text="${e.rotulo}">Estilo</option>
        </select>
      </label>
      <label class="campo-check"><input type="checkbox" th:field="*{cobertura}"> É cobertura?</label>
      <label class="campo">Foto da tatuagem atual <span class="ajuda">(obrigatória se for cobertura)</span>
        <input type="file" name="fotoAtual" accept="image/jpeg,image/png"></label>
      <label class="campo">Descrição <textarea th:field="*{descricao}" maxlength="2000"></textarea></label>
      <label class="campo">Preferência de dias <input th:field="*{preferenciaDias}" placeholder="Ex.: sextas à tarde"></label>
      <label class="campo">Imagens de referência <span class="ajuda">(1 a 5, JPG ou PNG, até 5MB cada)</span>
        <input type="file" name="imagens" accept="image/jpeg,image/png" multiple></label>
      <label class="campo-check"><input type="checkbox" th:field="*{aceitePrivacidade}"> Li e aceito o Aviso de Privacidade</label>
      <button class="btn btn-bloco" type="submit">Enviar pedido</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
