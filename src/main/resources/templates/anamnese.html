<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Anamnese')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo}"></header>
<main class="secao container">
  <div class="cartao">
    <h1>Ficha de anamnese</h1>
    <p class="alerta" th:if="${erro}" th:text="${erro}" role="alert">Erro</p>
    <form th:action="@{/anamnese/{t}(t=${token})}" th:object="${form}" method="post">
      <p class="alerta" th:each="e : ${#fields.allErrors()}" th:text="${e}" role="alert">Erro</p>
      <label class="campo">Alergias <input th:field="*{alergias}"></label>
      <label class="campo">Medicamentos em uso <input th:field="*{medicamentos}"></label>
      <label class="campo">Problemas de cicatrização <input th:field="*{problemasCicatrizacao}"></label>
      <label class="campo-check"><input type="checkbox" th:field="*{diabetes}"> Tenho diabetes</label>
      <label class="campo-check"><input type="checkbox" th:field="*{gestacao}"> Estou gestante</label>
      <label class="campo">Observações <textarea th:field="*{observacoes}" maxlength="2000"></textarea></label>
      <fieldset class="destaque-lgpd">
        <legend>Consentimento para dados de saúde (LGPD, art. 11, I)</legend>
        <label class="campo-check"><input type="checkbox" th:field="*{consentimentoDadosSaude}"> Consinto, de forma específica e destacada, com o uso destes dados de saúde pelo tatuador para avaliar e realizar a sessão.</label>
      </fieldset>
      <button class="btn btn-bloco" type="submit">Enviar ficha</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
