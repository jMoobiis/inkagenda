<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Login')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo}"></header>
<main class="secao container">
  <div class="cartao">
    <h1>Login</h1>
    <p class="alerta" th:if="${param.error}" role="alert">E-mail ou senha inválidos.</p>
    <form th:action="@{/login}" method="post">
      <label class="campo">E-mail <input type="email" name="username" required autocomplete="username"></label>
      <label class="campo">Senha <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-bloco" type="submit">Entrar</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
