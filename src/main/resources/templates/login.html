<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | InkAgenda</title></head>
<body>
<main>
  <h1>Login</h1>
  <p th:if="${param.error}">E-mail ou senha inválidos.</p>
  <form th:action="@{/login}" method="post">
    <label>E-mail <input type="email" name="username" required autocomplete="username"></label>
    <label>Senha <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
