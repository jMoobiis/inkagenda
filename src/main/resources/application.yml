spring:
  application:
    name: inkagenda
  datasource:
    url: jdbc:h2:file:./data/inkagenda;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

inkagenda:
  uploads-dir: ./uploads
  base-url: http://localhost:8080

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
